services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DATABASE_SERVER: ${DATABASE_SERVER:-db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-gas}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-gas}
      DATABASE_NAME: ${DATABASE_NAME:-gas}
      SITE_URL: ${SITE_URL:-http://localhost:8080/}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=200
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-gas-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-gas}
      MARIADB_USER: ${MARIADB_USER:-gas}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-gas}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ./docker/mysql:/var/lib/mysql
      - ./docker/seed/001-gas.sql:/docker-entrypoint-initdb.d/001-gas.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
